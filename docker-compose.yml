services:
  db:
    container_name: hh_db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh_local_pw
      POSTGRES_DB: hh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d hh"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  prefect-server:
    container_name: prefect_server
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0 --port 4200
    depends_on:
      db:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://hh:hh_local_pw@db:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: /api
    networks:
      - default

  hh-orchestrator:
    container_name: hh_orchestrator
    image: hh_applicant_tool:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m orchestration.serve
    # Сервер общий с другими проектами: без потолка залп ранов уводил хост в своп.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_started
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - CONFIG_DIR=/app/config
      - TZ=Europe/Moscow
      - HH_DB_DSN=postgresql://hh:hh_local_pw@db:5432/hh
      - HH_DB_SCHEMA=public
      - PREFECT_API_URL=http://prefect-server:4200/api
      - ORCH_ENABLED=all
    networks:
      - default

  prefect-proxy:
    container_name: prefect_proxy
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - prefect-server
    volumes:
      - ./nginx/prefect.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "4200:4200"
    networks:
      - default

  hh-web:
    container_name: hh_web
    image: hh_applicant_tool:latest
    restart: always
    command: python -u -m uvicorn services.web_app:app --host 0.0.0.0 --port 60080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - CONFIG_DIR=/app/config
      - TZ=Europe/Moscow
      - HH_DB_DSN=postgresql://hh:hh_local_pw@db:5432/hh
      - HH_DB_SCHEMA=public
    ports:
      - "127.0.0.1:60080:60080"
    networks:
      - default

  hh-listener:
    container_name: hh_listener
    image: hh_applicant_tool:latest
    restart: always
    command: python -u /app/services/tg_connect_bot.py
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - CONFIG_DIR=/app/config
      - TZ=Europe/Moscow
      - HH_DB_DSN=postgresql://hh:hh_local_pw@db:5432/hh
      - HH_DB_SCHEMA=public
      - HH_ACCOUNT=egor
      - PYTHONPATH=/app/services
    networks:
      - default

  # Зашифрованный канал к vLLM на b6000-2 (194.67.111.92; l40s 109.120.182.219 мёртв с ~09.2026,
  # туннель 37 962 раза перезапускался в «Connection refused» — починено 18.09): ssh -L в socat-мост
  # (hh_llm_bridge на b6000-2 слушает только 127.0.0.1:18000 -> tpro-vllm:8000; пользователь hhtunnel,
  # ключ ограничен restrict,port-forwarding,permitopen+from=ds1908 в authorized_keys).
  llm-tunnel:
    container_name: hh_llm_tunnel
    image: hh_applicant_tool:latest
    restart: unless-stopped
    command: >
      ssh -N
      -i /app/config/.llm_tunnel_key
      -o UserKnownHostsFile=/app/config/.llm_known_hosts
      -o StrictHostKeyChecking=yes
      -o BatchMode=yes
      -o ExitOnForwardFailure=yes
      -o ServerAliveInterval=30
      -o ServerAliveCountMax=3
      -o TCPKeepAlive=yes
      -L 0.0.0.0:18000:127.0.0.1:18000
      hhtunnel@194.67.111.92
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default

volumes:
  pgdata:
